name: Quality Assurance
on:
  push:
    branches:
      - main
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "flake.nix"
      - "flake.lock"
      - "data/**"
      - ".github/workflows/run-tests.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "flake.nix"
      - "flake.lock"
      - "data/**"
      - ".github/workflows/run-tests.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOMODCACHE: /home/runner/go/pkg/mod
  GOCACHE: /home/runner/.cache/go-build

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Cache Go modules, build cache, and golangci-lint cache
      # CGO compilation (GTK bindings) is expensive - this is the main optimization
      - name: Cache Go artifacts
        id: go-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            /home/runner/go/pkg/mod
            /home/runner/.cache/go-build
            /home/runner/.cache/golangci-lint
          # flake.lock pins the Go toolchain, and GOCACHE entries are keyed by
          # compiler version — without it in the key, a toolchain bump restores
          # a cache no build can hit.
          key: go-lint-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-lint-${{ runner.os }}-${{ hashFiles('flake.lock') }}-

      - name: Run golangci-lint
        run: nix develop --command golangci-lint run

      # internal/reconnect imports math/rand/v2, whose Go 1.27 source uses a
      # generic method that gosec's Go 1.26 type checker rejects. Drop the
      # exclusion once nixpkgs builds gosec against Go 1.27.
      - name: Run Gosec Security Scanner
        run: nix develop --command gosec -exclude-dir=internal/reconnect ./...

      - name: Run govulncheck
        run: nix develop --command govulncheck ./...

      - name: Verify helper systemd unit
        run: |
          # A misspelled directive is only a warning and still exits 0, so also
          # fail on any per-unit diagnostic — a hardening directive that
          # silently does nothing is the bug worth catching. Matching the unit
          # name ignores unrelated notices. ExecStart must exist, hence the stub.
          sudo install -Dm755 /dev/null /usr/bin/openfortivpn-gui-helper
          if ! output=$(systemd-analyze verify data/openfortivpn-gui-helper.service 2>&1); then
            printf '%s\n' "$output"
            exit 1
          fi
          if printf '%s\n' "$output" | grep -F 'openfortivpn-gui-helper.service:'; then
            exit 1
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Cache Go modules and build cache
      # CGO compilation (GTK bindings) is expensive - this is the main optimization
      - name: Cache Go artifacts
        id: go-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            /home/runner/go/pkg/mod
            /home/runner/.cache/go-build
          # flake.lock pins the Go toolchain, and GOCACHE entries are keyed by
          # compiler version — without it in the key, a toolchain bump restores
          # a cache no build can hit.
          key: go-test-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-test-${{ runner.os }}-${{ hashFiles('flake.lock') }}-

      - name: Run tests with coverage
        run: nix develop --command go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4 # v7.1.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          fail_ci_if_error: false
