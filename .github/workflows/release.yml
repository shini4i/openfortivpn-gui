name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    # Build in a Debian Trixie container: it ships libadwaita 1.7+ (required by the
    # gotk4-adwaita bindings) and glibc 2.41, the lowest floor that still satisfies
    # the binding. nfpm emits both .deb and .rpm from the resulting binary, which
    # then runs on Debian 13+, Ubuntu 25.04+, and current Fedora (glibc >= 2.41).
    container: debian:trixie
    timeout-minutes: 30
    permissions:
      contents: write
      # Required for cosign keyless signing: the OIDC token attests the
      # workflow identity in the signature certificate.
      id-token: write
    steps:
      # clang is the cgo compiler here and in the Nix devshell, so this job, CI
      # and local builds share one compiler. It also builds the gotk4/libadwaita
      # shims roughly 5x faster than gcc, and this job always starts cold.
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git clang pkg-config ca-certificates curl gettext-base \
            libgtk-4-dev libadwaita-1-dev libsecret-1-dev gobject-introspection

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fix git permissions
        run: git config --global --add safe.directory $GITHUB_WORKSPACE

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # syft generates the SBOMs declared in .goreleaser.yaml
      - name: Install syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      # cosign signs the checksum file (keyless, see signs in .goreleaser.yaml)
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-nixpkgs:
    needs: goreleaser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Update nixpkgs
        uses: shini4i/nixpkgs-updater@v1
        with:
          package-name: openfortivpn-gui
          version: ${{ github.ref_name }}
          target-repo: shini4i/nixpkgs
          github-token: ${{ secrets.NIXPKGS_TOKEN }}
