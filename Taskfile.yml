version: '3'

vars:
  BINARY: openfortivpn-gui

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list
    silent: true

  build:
    desc: Build the application
    cmds:
      - go build -o {{.BINARY}} ./cmd/openfortivpn-gui
    sources:
      - '**/*.go'
      - go.mod
      - go.sum
    generates:
      - '{{.BINARY}}'

  run:
    desc: Run the application
    cmds:
      - go run ./cmd/openfortivpn-gui

  test:
    desc: Run all tests with race detector
    cmds:
      - go test -race ./...

  test:verbose:
    desc: Run all tests with verbose output
    cmds:
      - go test -race -v ./...

  test:coverage:
    desc: Run tests with coverage report
    cmds:
      - go test -race -coverprofile=coverage.out ./...
      - go tool cover -html=coverage.out -o coverage.html
      - echo "Coverage report generated at coverage.html"

  lint:
    desc: Run the same static analysis as CI
    cmds:
      - golangci-lint run
      # internal/reconnect imports math/rand/v2, whose Go 1.27 source uses a
      # generic method that gosec's Go 1.26 type checker rejects. Drop the
      # exclusion once nixpkgs builds gosec against Go 1.27.
      - gosec -exclude-dir=internal/reconnect ./...
      - govulncheck ./...

  vet:
    desc: Run go vet only (fast subset of lint)
    cmds:
      - go vet ./...

  fmt:
    desc: Format Go source files
    cmds:
      - go fmt ./...

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -f {{.BINARY}}
      - rm -f coverage.out coverage.html
