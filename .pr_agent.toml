# PR-Agent (Qodo Merge) repository configuration.
#
# Read from the repository's DEFAULT branch, so changes take effect on PRs
# opened AFTER this file is merged to main — not on the PR that introduces it.
#
# Model routing (config.model / fallback_models) and the auto_* automation
# flags stay in .github/workflows/pr-agent.yml: env/CLI settings take
# precedence over this file, so duplicating them here would be shadowed and
# misleading. This file only tunes review/suggestion behaviour.

[pr_reviewer]
# Default cap is 3, too low for an app with a privileged helper daemon and a
# GTK main-thread invariant that both fail catastrophically (root exec / SIGSEGV).
num_max_findings = 5
# Surface leftover TODO/FIXME markers.
require_todo_scan = true
# No external ticket system is wired up; the compliance pass only adds noise.
require_ticket_analysis_review = false
extra_instructions = """
Project: openfortivpn-gui — a Linux GTK4/libadwaita desktop front-end (Go 1.26)
that drives the openfortivpn CLI, split into an unprivileged GUI and a
privileged helper daemon. Review against the ACTUAL stack in this repo, not
generic Go idioms:

Stack (do not suggest swapping these out):
- GUI toolkit: gotk4 + gotk4-adwaita (github.com/diamondburned/gotk4*). NOT fyne
  for widgets, NOT gio. System tray only: fyne.io/systray.
- Logging: log/slog via internal/logging. NOT zerolog/logrus.
- Secret storage: zalando/go-keyring (Secret Service / godbus). NOT plaintext files.
- IPC: length-prefixed JSON over a Unix socket (internal/helper/protocol),
  GUI-side client in internal/client, daemon in internal/helper/server.
- Testing: testify only (no gomock/mockgen). Follows TDD.

Focus areas (highest value for this codebase):
- GTK main-thread safety. gotk4/adwaita/systray objects may be touched ONLY on
  the GTK main thread. VPN controller callbacks (internal/vpn/controller.go) and
  the reconnect manager fire on background goroutines, so any widget/tray access
  from them MUST be marshalled via glib.IdleAdd (the UI layer's scheduleOnMain
  seam). Flag any direct GTK/systray call reached from a controller callback,
  goroutine, or timer — the failure mode is a hard SIGSEGV, not a race warning.
- Privilege boundary (internal/helper/server). The daemon runs privileged and
  execs openfortivpn. Access control is the socket's group permission (Chmod
  0660) plus an SO_PEERCRED uid/gid check — flag any new command handler that
  skips the peer-credential check, any widening of socket permissions, and any
  request field that flows into a filesystem path, argument, or process without
  validation. Every protocol.Command must be authenticated the same way.
- Subprocess handling (internal/vpn/executor.go). openfortivpn is spawned with
  exec.CommandContext (no shell) and killed by process-group signal via pkexec.
  Flag shell interpolation of profile fields, unclosed stdout/stderr pipes,
  leaked goroutines scanning process output, orphaned/zombie processes on
  cancel, and OTP/credential values written to logs or error strings. Preserve
  existing #nosec annotations and their justifications; a removed suppression
  needs a stated reason.
- Concurrency & data races. Beyond the GTK seam, scrutinise shared state in the
  reconnect manager (internal/reconnect), stats collector (internal/stats), and
  controller state machine (internal/vpn/state.go) — access without the right
  lock, or channels/goroutines leaked on disconnect/shutdown.
- Tests. New behaviour must ship with table-driven testify tests. Unix-socket
  tests must bind abstract or short socket paths, NOT t.TempDir() — CI $TMPDIR
  overflows sun_path (108 bytes). Flag mutated logic left uncovered.

Keep feedback specific and actionable; skip stylistic nits already enforced by
golangci-lint, gosec, and gofmt in CI.
"""

[pr_code_suggestions]
# Only surface high-confidence suggestions so the on-demand /improve pass stays
# signal-dense (auto_improve is intentionally off in the workflow).
suggestions_score_threshold = 7
extra_instructions = """
- Suggest fixes that match this repo's stack: gotk4/adwaita widgets, slog
  logging, go-keyring secret storage, the Unix-socket helper protocol. Do not
  propose migrating GUI toolkits or IPC mechanisms.
- Prefer correctness/concurrency/privilege/security fixes over cosmetic
  refactors; GTK-thread and helper-daemon issues rank highest.
- Respect the GUI/helper split: never suggest moving privileged work into the
  GUI process or GTK work into the helper.
"""
